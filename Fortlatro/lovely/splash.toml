[manifest]
version = "1.0.0"
dump_lua = true
priority = 0

[[patches]]
[patches.pattern]
target = "game.lua"
position = "before"
pattern = "if G.debug_splash_size_toggle then "
payload = '''
-- Fortlatro Splash Text (Vall-style)
if G.STAGE ~= G.STAGES.MAIN_MENU and G.fort_splash then
	G.FORT_LAVA_DRAW_ACTIVE = false
    G.fort_splash = nil
end

if G.STAGE == G.STAGES.MAIN_MENU and not G.fort_splash then
	G.FORT_LAVA_DRAW_ACTIVE = false
	MicMod.active = false
    G.GAME.MicLevel = nil
	G.FIND_GAME.active = false
	G.DODGE_GAME.active = false
    G.DODGE_GAME.beams = {} 
	G.DODGE_GAME.shake_timer = 0
	G.DEFENSE_GAME.active = false
	G.PIPE_GAME.active = false
	G.KOVAAK_GAME.active = false
	G.GAME.Practice = true
	Fortlatro.clear_ads()
	if G.LIGHTNERS_LIVE_GAME and G.LIGHTNERS_LIVE_GAME.active then
		G.LIGHTNERS_LIVE_GAME.active = false
	end
    if Fortlatro and Fortlatro.initialize_splashtext then
        Fortlatro.initialize_splashtext()
    end
end

if G.fort_splash then
    love.graphics.push()
    G.fort_splash:draw()
    love.graphics.pop()
end
'''
match_indent = true
