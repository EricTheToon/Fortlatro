[manifest]
version = "1.0.0"
dump_lua = true
priority = 1

########################################
# Pool Modifications – Fortlatro Only
########################################

[[patches]]
[patches.pattern]
target = "functions/common_events.lua"
pattern = '''if add and not G.GAME.banned_keys[v.key] then'''
position = "before"
match_indent = true
payload = '''
if G.GAME.selected_back
and G.GAME.selected_back.effect
and G.GAME.selected_back.effect.center.key == "b_fn_FortniteDeck" then
    if not v.mod or v.mod.id ~= "Fortlatro" then
        add = false
    end
end
'''

########################################
# Boss Pool Filtering – Fortlatro Only
########################################

[[patches]]
[patches.pattern]
target = "functions/common_events.lua"
pattern = '''local min_use = 100'''
position = "before"
match_indent = true
payload = '''
if G.GAME.selected_back
and G.GAME.selected_back.effect
and G.GAME.selected_back.effect.center.key == "b_fn_FortniteDeck" then
    for k, v in pairs(eligible_bosses) do
        if eligible_bosses[k]
        and (not G.P_BLINDS[k].mod or G.P_BLINDS[k].mod.id ~= "Fortlatro") then
            eligible_bosses[k] = nil
        end
    end
end
'''

########################################
# Empty Pool Fallback – Weighted Fortlatro Joker (No Repeats, Respects in_pool)
########################################

[[patches]]
[patches.pattern]
target = "functions/common_events.lua"
pattern = '''if _pool_size == 0 then'''
position = "before"
match_indent = true
payload = '''
if _pool_size == 0
and G.GAME.selected_back
and G.GAME.selected_back.effect
and G.GAME.selected_back.effect.center.key == "b_fn_FortniteDeck" then

    -- Initialize used defaults table if needed
    G.GAME.used_defaults = G.GAME.used_defaults or {}

    local Fortlatro_joker_pool = {}
    local all_possible = {}
    local total_weight = 0

    -- Collect all valid Fortlatro jokers (excluding Legendaries) that pass their in_pool check
    for k, v in pairs(G.P_CENTERS) do
        if v.set == "Joker"
        and v.rarity
        and v.rarity ~= 4  -- Exclude Legendaries
        and v.mod
        and v.mod.id == "Fortlatro" then
            
            -- Check if custom in_pool allows it to spawn right now
            local can_spawn = true
            if v.in_pool and type(v.in_pool) == "function" then
                can_spawn = v.in_pool(v)
            end

            if can_spawn then
                -- Assign weight based on rarity (Common=8, Uncommon=4, Rare=2)
                local rarity = v.rarity or 1
                local weight = 8
                if rarity == 2 then weight = 4
                elseif rarity == 3 then weight = 2 end

                all_possible[#all_possible + 1] = { key = k, weight = weight }

                -- Only include unused jokers for the primary roll pool
                if not G.GAME.used_defaults[k] then
                    Fortlatro_joker_pool[#Fortlatro_joker_pool + 1] = { key = k, weight = weight }
                    total_weight = total_weight + weight
                end
            end
        end
    end

    -- If all possible defaults have been used, reset tracking and rebuild pool weights
    if #Fortlatro_joker_pool == 0 and #all_possible > 0 then
        G.GAME.used_defaults = {}
        for _, item in ipairs(all_possible) do
            Fortlatro_joker_pool[#Fortlatro_joker_pool + 1] = item
            total_weight = total_weight + item.weight
        end
    end

    -- Pick a random unused (or reset) joker using weighted distribution
    if #Fortlatro_joker_pool > 0 and total_weight > 0 then
        local roll = pseudorandom('fortlatro_fallback') * total_weight
        local chosen_sprite = nil

        for _, item in ipairs(Fortlatro_joker_pool) do
            roll = roll - item.weight
            if roll <= 0 then
                chosen_sprite = item.key
                break
            end
        end

        if chosen_sprite then
            -- Mark as used
            G.GAME.used_defaults[chosen_sprite] = true

            _pool = { chosen_sprite }
            _pool_size = 1
        end
    end
end
'''


########################################
# Booster Pack Filtering – Fortlatro Only
########################################

[[patches]]
[patches.pattern]
target = '=[SMODS _ "src/overrides.lua"]'
pattern = '''
if add and not G.GAME.banned_keys[v.key] then cume = cume + (v.current_weight or 1); temp_in_pool[v.key] = true end
'''
position = "before"
match_indent = true
payload = '''
if G.GAME.selected_back
and G.GAME.selected_back.effect
and G.GAME.selected_back.effect.center.key == "b_fn_FortniteDeck" then
    if not v.mod or v.mod.id ~= "Fortlatro" then
        add = false
    end
end
'''